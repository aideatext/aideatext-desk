name: Desplegar web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  pull_request:
    branches: [main]
    paths: ['web/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, no 20: vitest@5 exige ^22.12.0 || ^24.0.0 || >=26.0.0.
          # Con Node 20 este workflow fallaria en `npm test` pero pasaria el
          # build, porque vite@6 si acepta Node 20 -- un fallo desconcertante.
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Ejecutar pruebas
        working-directory: web
        run: npm test

      - name: Construir
        working-directory: web
        run: npm run build

      - name: Desplegar
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          # La API gestionada del propio Static Web App: vive en el MISMO
          # origen, asi que `connect-src 'self'` la permite sin tocar la
          # politica. Por eso la pagina tiene que DECIR que existe — lo
          # hace en «Seguridad», con un boton que enseña lo que manda.
          api_location: api
          skip_app_build: true
